<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente Carta Poder</title>
    <!-- Importar Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Importar Tailwind CSS para el diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos específicos para cuando se imprima el documento */
        @media print {
            body {
                background-color: white !important;
                padding: 0 !important;
            }
            #app {
                padding: 0 !important;
            }
            .document-container {
                box-shadow: none !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 1cm !important;
            }
            /* Ocultar botones o elementos de interfaz que no deben imprimirse */
            .no-print {
                display: none !important;
            }
        }
        
        /* Asegurar una fuente serif tradicional para documentos legales */
        .legal-font {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body class="bg-gray-200 p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div id="app" class="w-full max-w-4xl">
        <div class="mb-4 text-center no-print">
            <p class="text-gray-600 text-sm mb-2">Vista previa del componente Vue. Presiona Ctrl+P (o Cmd+P) para ver cómo se imprimiría.</p>
        </div>
        <!-- Aquí se renderiza nuestro componente Vue -->
        <carta-poder></carta-poder>
    </div>

    <script>
        const { createApp } = Vue;

        // Definición del componente Vue 3
        const CartaPoder = {
            name: 'CartaPoder',
            template: `
                <!-- Contenedor principal del documento simulando una hoja de papel -->
                <div class="document-container bg-white px-8 py-12 md:px-16 md:py-16 shadow-xl text-black legal-font leading-relaxed text-justify relative mx-auto">
                    
                    <!-- Título del documento -->
                    <h1 class="text-center font-bold text-xl mb-10 tracking-wide uppercase">CARTA PODER</h1>

                    <!-- Párrafo 1: Otorgamiento -->
                    <p class="mb-5 text-[15px]">
                        Yo <span class="font-bold underline">CUEVAS ROSADO IRMA</span> con domicilio en <span class="font-bold underline">CUBA 405, 27 DE SEPTIEMBRE, C.P. 93320, POZA RICA DE HIDALGO, VER.,</span> y con identificación oficial <span class="font-bold underline">INE No. 3156035386519</span>, por medio de la presente otorgo poder amplio, cumplido y bastante a favor de <span class="font-bold underline">PAMELA HAYDEE LUNA ROSALINO</span> quien se identifica con <span class="font-bold underline">INE No. 3151124360365</span>, para que en mi nombre y representación realice las gestiones necesarias, firme y suscriba los contratos de interconexión y contraprestación ante la Comisión Federal de Electricidad (CFE), así como cualquier documento relacionado con dichos contratos, dando por válidas y legales todas y cada una de las gestiones que realice.
                    </p>

                    <!-- Párrafo 2: Limitaciones de honorarios -->
                    <p class="mb-5 text-[15px]">
                        Manifiesto que la persona antes mencionada ha sido contratada únicamente para realizar los procesos como gestor de contratos de interconexión y contraprestación, no excediendo sus honorarios lo establecido en el artículo 2556 del CÓDIGO CIVIL FEDERAL.
                    </p>

                    <!-- Párrafo 3: Vigencia -->
                    <p class="mb-10 text-[15px]">
                        El presente poder se otorga con carácter de especial, limitándose exclusivamente a la facultad descrita en el párrafo anterior, el cual tendrá una <span class="font-bold">vigencia de 6 meses</span> contados a partir de la firma del presente.
                    </p>

                    <!-- Fecha y Lugar -->
                    <!-- Simulo el texto escrito a mano con cursiva y color azul oscuro -->
                    <p class="mb-12 text-[15px]">
                        En la ciudad de <span class="font-bold">Poza Rica de Hidalgo, Ver</span>, a los <span class="underline text-blue-900 italic px-1 font-sans text-lg">15</span> días del mes de <span class="underline text-blue-900 italic px-1 font-sans text-lg">agosto</span> de 2026.
                    </p>

                    <!-- Bloque de Firmas Principales (Otorgante y Apoderado) -->
                    <div class="grid grid-cols-2 border border-black mb-12">
                        <!-- Columna Otorgante -->
                        <div class="border-r border-black flex flex-col">
                            <div class="text-center border-b border-black py-1 font-semibold text-sm">OTORGANTE</div>
                            <div class="h-32 flex flex-col justify-end items-center pb-3">
                                <!-- Línea para firmar -->
                                <div class="w-4/5 border-b border-black"></div>
                                <!-- Nombre impreso -->
                                <div class="mt-1 text-[15px]">Irma Cuevas Rosado</div>
                            </div>
                        </div>
                        
                        <!-- Columna Apoderado -->
                        <div class="flex flex-col">
                            <div class="text-center border-b border-black py-1 font-semibold text-sm">APODERADO</div>
                            <div class="h-32 flex flex-col justify-end items-center pb-3">
                                <!-- Línea para firmar -->
                                <div class="w-4/5 border-b border-black"></div>
                                <!-- Nombre impreso -->
                                <div class="mt-1 text-[15px]">Pamela Haydee Luna Rosalino</div>
                            </div>
                        </div>
                    </div>

                    <!-- Sección de Testigos -->
                    <div class="mt-8 mb-6">
                        <!-- Título de testigos con el color azul específico del documento -->
                        <h2 class="text-center text-4xl font-bold text-[#3B5A9A] tracking-wider mb-2">TESTIGOS</h2>
                        <hr class="border-t-2 border-[#82A2D4] w-full">
                    </div>

                    <!-- Bloque de Firmas de Testigos -->
                    <div class="grid grid-cols-2 border border-black">
                        <!-- Columna Testigo 1 -->
                        <div class="border-r border-black flex flex-col">
                            <div class="text-center border-b border-black py-1 font-semibold text-sm">Testigo 1</div>
                            <div class="h-32 flex flex-col justify-end items-center pb-3">
                                <div class="w-4/5 border-b border-black"></div>
                                <div class="mt-1 text-[15px]">German Acosta Larios</div>
                            </div>
                        </div>
                        
                        <!-- Columna Testigo 2 -->
                        <div class="flex flex-col">
                            <div class="text-center border-b border-black py-1 font-semibold text-sm">Testigo 2</div>
                            <div class="h-32 flex flex-col justify-end items-center pb-3">
                                <div class="w-4/5 border-b border-black"></div>
                                <div class="mt-1 text-[15px]">Geraldine Navarro Cruz</div>
                            </div>
                        </div>
                    </div>

                </div>
            `
        };

        // Inicializar la aplicación Vue y montar el componente
        createApp({
            components: {
                CartaPoder
            }
        }).mount('#app');
    </script>
</body>
</html>
